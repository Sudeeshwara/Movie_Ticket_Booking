spring.application.name=movie-ticket-booking
server.port=8080

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Base64 encoded 256-bit secret. Change this for your own deployment.
app.jwt.secret=ZmQ0ZGI5NjQ0MDQwY2I4MjMxY2Y3ZmI3MjdhN2ZmMjNhODViOTg1ZGE0NTBjMGM4NDA5NzYxMjdjOWMwYWRmZQ==
# 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- Default admin (created on first start if missing) ----------
app.admin.email=admin@cinema.lk
app.admin.password=admin123

# ---------- Logging ----------
logging.level.root=INFO
logging.level.lk.ijse.movieticket=DEBUG
logging.file.name=logs/movie-ticket-booking.log
